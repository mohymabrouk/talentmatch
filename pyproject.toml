[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talentmatch"
version = "0.1.0"
description = "Content-based job recommendation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
]
retrieval = [
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=3,<4",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]

[tool.setuptools]
packages = [
  "app",
  "app.api",
  "app.api.routes",
  "app.db",
  "app.schemas",
  "app.services",
  "ml",
  "ml.evaluation",
  "ml.retrieval",
]

[tool.setuptools.package-dir]
"" = "backend"
"ml" = "ml"

[tool.ruff]
line-length = 100
target-version = "py311"
