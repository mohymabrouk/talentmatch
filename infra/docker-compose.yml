services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentmatch
      POSTGRES_USER: talentmatch
      POSTGRES_PASSWORD: talentmatch
    ports:
      - "5432:5432"
    volumes:
      - talentmatch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentmatch -d talentmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg://talentmatch:talentmatch@postgres:5432/talentmatch
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  talentmatch-postgres:

